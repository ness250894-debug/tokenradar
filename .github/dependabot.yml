version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      next-runtime:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      test-and-tooling:
        patterns:
          - "@types/*"
          - "eslint"
          - "eslint-config-next"
          - "tsx"
          - "typescript"
          - "vite"
          - "vitest"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
