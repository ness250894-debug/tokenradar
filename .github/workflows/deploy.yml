# Deploy to Cloudflare Pages
# Triggers on push to main branch and manual dispatch.
# Builds the Next.js static export and deploys via Wrangler.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Production ref (main only for manual deploys)'
        required: false
        default: 'main'
  workflow_call:
    inputs:
      ref:
        description: 'Production ref (main or an exact main commit SHA)'
        required: false
        type: string
        default: 'main'
      allow_sha_ref:
        description: 'Allow a reusable caller to deploy a full commit SHA'
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      INDEXNOW_KEY:
        required: false
      COINGECKO_API_KEY:
        required: false
      TELEGRAM_REPORT_BOT_TOKEN:
        required: false
      TELEGRAM_REPORT_CHAT_ID:
        required: false

env:
  NODE_VERSION: "22"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate deploy ref
        if: github.event_name != 'push'
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.ref || 'main' }}
          ALLOW_SHA_REF: ${{ inputs.allow_sha_ref || false }}
        run: |
          set -euo pipefail
          ref="$DEPLOY_REF"
          case "$ref" in
            main|refs/heads/main)
              ;;
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
              if [ "$ALLOW_SHA_REF" != "true" ]; then
                echo "::error::Manual deploys may only target the protected main branch."
                exit 1
              fi
              ;;
            *)
              echo "::error::Manual deploys may only target main. Reusable deploys may target main or a full commit SHA."
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Do not persist .next/cache: production builds receive provider secrets,
      # and framework caches can retain resolved environment values.
      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.SITE_NAME || 'TokenRadar' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Audit rendered SEO inventory
        run: npm run seo:qa

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Error: 'out' directory not found. Build likely failed."
            exit 1
          fi
          
          FILE_COUNT=$(find out -type f | wc -l)
          npm run deploy:check-files
          echo "📊 Total files in out/: $FILE_COUNT"
          echo "✅ Static export verified ($FILE_COUNT files)."

      - name: Scan deployment output for resolved secrets
        run: npm run security:secrets:build
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Verify deployment is current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ -z "$current_main_sha" ]; then
            echo "::error::Unable to resolve the current main branch SHA."
            exit 1
          fi
          if [ "$checked_out_sha" != "$current_main_sha" ]; then
            echo "::error::Refusing to deploy stale commit $checked_out_sha; current main is $current_main_sha."
            exit 1
          fi
          echo "Verified current main commit: $checked_out_sha"

      - name: Deploy to Cloudflare Pages
        run: |
          # Static asset upload with the scoped /compare Pages Function from public/_worker.js.
          npx wrangler pages deploy out/ \
            --project-name=tokenradar \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping IndexNow
        continue-on-error: true
        run: npx tsx scripts/ping-indexnow.ts
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Upload deploy diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .next/trace
            .next/diagnostics/
            data/_*_blob.json
            data/_registry.json
            public/sitemap*.xml
            npm-debug.log*
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Deploy Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
