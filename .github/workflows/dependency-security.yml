name: Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "20 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Upload dependency diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            package.json
            package-lock.json
            npm-debug.log*
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Dependency Security Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
