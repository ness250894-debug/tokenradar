# Daily Data Refresh
# Runs every day at 17:45 UTC to fetch fresh token data,
# recompute metrics, and redeploy the site.

name: Daily Refresh

on:
  schedule:
    - cron: "45 17 * * *" # 17:45 UTC daily
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}

concurrency:
  group: generated-main-publication
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    name: Fetch Data & Refresh
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: coingecko-api-counter
      cancel-in-progress: false
      # Supported by GitHub Actions since 2026-05-07; actionlint v1.7.12 predates this schema field.
      queue: max
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      base_sha: ${{ steps.commit.outputs.base_sha }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
      branch: ${{ steps.commit.outputs.branch }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache data/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/cache
            !data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-data-refresh-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-coingecko-data-refresh-
            ${{ runner.os }}-coingecko-data-

      - name: Restore CoinGecko monthly quota counter
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-coingecko-api-counter-

      - name: Install dependencies
        run: npm ci

      - name: Fetch token data from CoinGecko
        run: npx tsx scripts/fetch-crypto-data.ts --start 1 --end 500 --lite --full-refresh-limit 25 --full-refresh-max-age-days 7
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Discover upcoming TGEs
        run: npx tsx scripts/discover-tges.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}


      - name: Fetch reference articles
        run: npx tsx scripts/fetch-reference-articles.ts
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Compute metrics
        run: npx tsx scripts/compute-metrics.ts
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Refresh Meta Access Tokens
        run: npx tsx scripts/refresh-meta-tokens.ts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Regenerate OG images
        run: npx tsx scripts/generate-og-images.tsx --force
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Validate refreshed artifacts
        run: |
          npx tsx scripts/compute-search-intent.ts
          npx tsx scripts/consolidate-data.ts
          npx tsx scripts/validate-content.ts
          npx tsx scripts/generate-sitemap.ts

      # Note: [skip ci] prevents the automation-branch push from starting unrelated workflows.
      # The trusted integration job explicitly dispatches CI before merging.
      - name: Commit updated data
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          askpass_script="$(mktemp)"
          cleanup_auth() {
            rm -f "$askpass_script"
            unset GIT_ASKPASS GIT_TERMINAL_PROMPT
          }
          trap cleanup_auth EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s" "x-access-token" ;;' \
            '  *) printf "%s" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass_script"
          chmod 700 "$askpass_script"
          export GIT_ASKPASS="$askpass_script"
          export GIT_TERMINAL_PROMPT=0

          git add \
            data/tokens \
            data/metrics \
            data/prices \
            data/references \
            data/tokens.json \
            data/upcoming-tges.json \
            data/search-intent.json \
            data/search-intent-history.json \
            data/_tokens_blob.json \
            data/_metrics_blob.json \
            data/_prices_blob.json \
            data/_registry.json \
            public/og/movers.png \
            public/sitemap.xml \
            public/sitemap-main.xml \
            public/sitemap-tokens.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/daily-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_sha="$(git rev-parse HEAD)"
          git commit -m "chore: daily data refresh [skip ci]"
          head_sha="$(git rev-parse HEAD)"
          pushed=false
          for i in 1 2 3; do
            remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "Unable to resolve remote main SHA"
              exit 1
            fi
            if [ "$remote_sha" != "$base_sha" ]; then
              echo "::error::Remote main changed from $base_sha to $remote_sha while daily refresh was running. Aborting instead of auto-merging generated data."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/${branch}"; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push daily refresh branch after 3 attempts"
            exit 1
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check CoinGecko monthly quota counter
        id: coingecko-quota-counter
        if: always()
        shell: bash
        run: |
          if [ -s data/cache/api-counter.json ] &&
            jq -e '(.month | type == "string") and (.count | type == "number" and . >= 0)' data/cache/api-counter.json >/dev/null; then
            echo "has_counter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_counter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save CoinGecko monthly quota counter
        if: always() && steps.coingecko-quota-counter.outputs.has_counter == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload reporting inputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-refresh-reporting-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/cache/api-counter.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload refresh diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/quarantine/
            data/cache/api-counter.json
            data/upcoming-tges.json
            public/og/movers.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Daily Refresh Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  report:
    name: Analytics & Reporting
    needs: refresh
    if: always() && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download reporting inputs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: daily-refresh-reporting-${{ github.run_id }}-${{ github.run_attempt }}
          path: data

      - name: Apply analytics ledger migrations
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: npx tsx scripts/d1-migrate.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Export engagement analytics baseline
        id: export-engagement-analytics
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: npm run analytics:baseline
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_AUTH_MODE: oauth
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOCIAL_ATTRIBUTION_LEDGER_REQUIRED: "true"

      - name: Dispatch System Report & Cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: npx tsx scripts/send-system-report.ts
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Surface analytics attribution refresh failure
        if: always() && steps.export-engagement-analytics.outcome == 'failure'
        run: |
          echo "::error::The GA4 attribution export failed; stale web-session totals will be excluded from social reporting."
          exit 1

      - name: Upload reporting diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-refresh-reporting-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/cache/api-counter.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Daily Refresh Reporting Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  integrate:
    name: Validate PR & Merge
    needs: refresh
    if: needs.refresh.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.publish-generated-pr.outputs.merge-sha }}
      pr_number: ${{ steps.publish-generated-pr.outputs.pr-number }}
      ci_run_id: ${{ steps.publish-generated-pr.outputs.ci-run-id }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.refresh.outputs.base_sha }}
          persist-credentials: false

      - name: Publish generated refresh PR
        id: publish-generated-pr
        uses: ./.github/actions/publish-generated-pr
        with:
          token: ${{ github.token }}
          branch: ${{ needs.refresh.outputs.branch }}
          base-sha: ${{ needs.refresh.outputs.base_sha }}
          head-sha: ${{ needs.refresh.outputs.head_sha }}
          title: "chore: publish daily data refresh"
          body: |
            Automated data publication from the Daily Refresh workflow.

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-integration-failure:
    name: Notify PR Integration Failure
    needs: integrate
    if: always() && needs.integrate.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}

    steps:
      - name: Notify on Failure
        continue-on-error: true
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Daily Refresh PR Integration Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"

  deploy:
    name: Redeploy Site
    needs: integrate
    if: needs.integrate.outputs.merge_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.integrate.outputs.merge_sha }}
      allow_sha_ref: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
      TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
