# Consolidated Social Automation Workflow
# Unified heartbeat for all social interactions on TokenRadar
#
# Platform cadence:
# - Telegram: 3 posts/day max (market brief, poll, movers)
# - X: 4 primary posts/day max, with a single daily link reply on the poll
# - Instagram: max 1 post/day, alternating carousel and Reel days
# - Threads: text-native signal 2x/week plus short-form video 3x/week
# - YouTube/TikTok: short-form video 3x/week

name: Social Automations

on:
  schedule:
    # --- Platform-aware cadence ---
    - cron: "00 00 * * *" # Telegram market brief
    - cron: "05 00 * * 0,2,4" # Instagram movers carousel (Sun/Tue/Thu)
    - cron: "00 03 * * *" # X market update
    - cron: "00 12 * * *" # X interactive poll + daily link reply
    - cron: "00 15 * * *" # Telegram poll + X market update
    - cron: "00 16 * * 2,4" # Threads text-native signal (Tue/Thu)
    - cron: "00 18 * * 1,3,5" # Short-form video (Mon/Wed/Fri)
    - cron: "00 21 * * *" # Telegram movers card + X market update
    
  workflow_dispatch:

concurrency:
  group: social-automations
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  IS_TELEGRAM_MARKET_RUN: ${{ github.event.schedule == '00 00 * * *' || github.event_name == 'workflow_dispatch' }}
  IS_X_MARKET_RUN: ${{ contains(fromJson('["00 03 * * *", "00 15 * * *", "00 21 * * *"]'), github.event.schedule) || github.event_name == 'workflow_dispatch' }}
  IS_X_POLL_RUN: ${{ github.event.schedule == '00 12 * * *' || github.event_name == 'workflow_dispatch' }}
  IS_TELEGRAM_POLL_RUN: ${{ github.event.schedule == '00 15 * * *' || github.event_name == 'workflow_dispatch' }}
  IS_TELEGRAM_MOVERS_RUN: ${{ github.event.schedule == '00 21 * * *' || github.event_name == 'workflow_dispatch' }}
  IS_THREADS_TEXT_RUN: ${{ github.event.schedule == '00 16 * * 2,4' || github.event_name == 'workflow_dispatch' }}
  IS_VIDEO_RUN: ${{ github.event.schedule == '00 18 * * 1,3,5' || github.event_name == 'workflow_dispatch' }}
  IS_INSTAGRAM_CAROUSEL_RUN: ${{ github.event.schedule == '05 00 * * 0,2,4' || github.event_name == 'workflow_dispatch' }}

jobs:
  post-social:
    name: Execute Network Routing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache data/cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-coingecko-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-coingecko-data-

      - name: Restore social tracking state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/posted
            data/posted_video
          key: ${{ runner.os }}-social-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-social-state-

      - name: Install dependencies
        run: npm ci

      # ─── 1. Telegram Market Update (1x/day) ──
      - name: Telegram Periodic Update
        if: env.IS_TELEGRAM_MARKET_RUN == 'true'
        run: npx tsx scripts/post-market-updates.ts --platform telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}

      # ─── 1b. Instagram Movers Carousel (Sun/Tue/Thu) ──
      - name: Instagram Daily Movers Carousel
        if: env.IS_INSTAGRAM_CAROUSEL_RUN == 'true'
        run: npx tsx scripts/post-instagram-daily-movers.ts
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # Meta Instagram
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # Cloudflare R2 (Media Staging)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # ─── 2. X Interactive Poll (daily link reply lives here) ───────────
      - name: X Daily Interactive Poll
        if: env.IS_X_POLL_RUN == 'true'
        run: npx tsx scripts/post-interactive-daily.ts --link-reply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}

      # ─── 3. Telegram Interactive Poll (1x/day) ────
      - name: Telegram Daily Interactive Poll
        if: env.IS_TELEGRAM_POLL_RUN == 'true'
        run: npx tsx scripts/post-daily-poll.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

      # ─── 4. X Market Update (3x/day, no repeated link replies) ──────
      - name: X Periodic Update
        if: env.IS_X_MARKET_RUN == 'true'
        run: npx tsx scripts/post-market-updates.ts --platform x
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}

      # ─── 5. Telegram Top Movers Image (1x/day @ 21:00 UTC) ────
      # Renders a Top 5 Gainers card in-memory using live CoinGecko data.
      # Image is never saved to disk - created, posted, and discarded.
      - name: Telegram Top Movers Card
        if: env.IS_TELEGRAM_MOVERS_RUN == 'true'
        run: npx tsx scripts/post-daily-movers.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}

      # Threads Text Signal (Tue/Thu; text-native, no video recycle)
      - name: Threads Text Signal
        if: env.IS_THREADS_TEXT_RUN == 'true'
        run: npx tsx scripts/post-threads-daily.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}

      # Short-form Video Breakout (Mon/Wed/Fri; IG/Threads/YT/TikTok only)
      - name: Install FFmpeg
        if: env.IS_VIDEO_RUN == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Short-form Video Breakout
        if: env.IS_VIDEO_RUN == 'true'
        run: npx tsx scripts/post-video-daily.ts --platform shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # Meta (Instagram + Threads)
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          # Cloudflare R2 (Media Staging)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # ─── Data State Synchronization ────────────────────────────
      - name: Prepare social tracking state
        if: always()
        run: mkdir -p data/posted data/posted_video

      - name: Save social tracking state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/posted
            data/posted_video
          key: ${{ runner.os }}-social-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Update X OAuth Secret
        # Requires GH_PAT with repo scope so rotating X refresh tokens can update repository secrets.
        if: always() && env.NEW_X_REFRESH_TOKEN != ''
        run: gh secret set X_OAUTH2_REFRESH_TOKEN --body "$NEW_X_REFRESH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Update Meta OAuth Secrets
        if: always() && (env.NEW_IG_ACCESS_TOKEN != '' || env.NEW_THREADS_ACCESS_TOKEN != '')
        run: |
          if [ -n "$NEW_IG_ACCESS_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$NEW_IG_ACCESS_TOKEN"
          fi
          if [ -n "$NEW_THREADS_ACCESS_TOKEN" ]; then
            gh secret set THREADS_ACCESS_TOKEN --body "$NEW_THREADS_ACCESS_TOKEN"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload social diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: social-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/posted/
            data/posted_video/
            data/cache/api-counter.json
            remotion-props.json
            *.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"$TELEGRAM_REPORT_CHAT_ID\", \"text\": \"❌ *Social Automation Failed*\\nWorkflow: ${{ github.workflow }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"Markdown\"}"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
