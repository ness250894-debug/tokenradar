# Consolidated Social Automation Workflow
# Unified heartbeat for all social interactions on TokenRadar
#
# Platform cadence:
# - Telegram: six distinct weekly posts, never more than one/day
# - X: five originals/week including one native video
# - Instagram: two Reels plus two five-slide carousels/week
# - Threads: text-native explainers Tue/Thu plus a Friday recap
# - YouTube: short-form video 3x/week; TikTok video posting is disabled

name: Social Automations

on:
  schedule:
    # --- Platform-aware cadence ---
    # Avoid minute 0/5: GitHub scheduled events can be delayed or dropped during top-of-hour load.
    - cron: "17 08 * * 1" # Telegram market map (Mon)
    - cron: "23 12 * * 1" # X token comparison (Mon)
    - cron: "17 15 * * 2,4,5" # X research notes (Tue/Thu/Fri)
    - cron: "37 15 * * 2" # Telegram token comparison (Tue)
    - cron: "17 16 * * 2,4" # Threads text-native signal (Tue/Thu)
    - cron: "29 16 * * 5" # Telegram + Threads weekly recap (Fri)
    - cron: "13 17 * * 3" # Telegram community poll (Wed)
    - cron: "29 18 * * 0,3" # Instagram evidence carousel (Sun/Wed)
    - cron: "41 18 * * 4" # Telegram Radar Divergence (Thu; independent of poll)
    - cron: "43 18 * * 3" # X native video (Wed)
    - cron: "47 18 * * 1,5" # Instagram Reels (Mon/Fri)
    - cron: "57 18 * * 1,3,5" # YouTube video
    - cron: "23 21 * * 0" # Telegram movers card (Sun)
    - cron: "53 * * * *" # Native social metrics collection (hourly window sampler)
    - cron: "31 08 * * 1" # Weekly social report + Meta token maintenance
    
  workflow_dispatch:
    inputs:
      run:
        description: "Which social automation to run"
        required: true
        default: "telegram-market"
        type: choice
        options:
          - telegram-market
          - telegram-comparison
          - telegram-movers
          - telegram-recap
          - telegram-divergence
          - telegram-poll
          - x-market
          - x-comparison
          - x-video
          - instagram-carousel
          - instagram-reel
          - threads-text
          - threads-recap
          - youtube-video
          - metrics
          - metrics-report
          - meta-token-refresh
          - d1-smoke

permissions: {}

env:
  NODE_VERSION: "22"
  # Scheduled publishing must never silently fall back to local-only dedupe.
  SOCIAL_DELIVERY_LEDGER_REQUIRED: "true"
  IG_AUTH_MODE: ${{ vars.IG_AUTH_MODE || 'facebook_login' }}
  IS_TELEGRAM_MARKET_RUN: ${{ github.event.schedule == '17 08 * * 1' || github.event.inputs.run == 'telegram-market' }}
  IS_X_MARKET_RUN: ${{ github.event.schedule == '17 15 * * 2,4,5' || github.event.inputs.run == 'x-market' }}
  IS_X_COMPARISON_RUN: ${{ github.event.schedule == '23 12 * * 1' || github.event.inputs.run == 'x-comparison' }}
  IS_TELEGRAM_COMPARISON_RUN: ${{ github.event.schedule == '37 15 * * 2' || github.event.inputs.run == 'telegram-comparison' }}
  IS_TELEGRAM_MOVERS_RUN: ${{ github.event.schedule == '23 21 * * 0' || github.event.inputs.run == 'telegram-movers' }}
  IS_TELEGRAM_RECAP_RUN: ${{ github.event.schedule == '29 16 * * 5' || github.event.inputs.run == 'telegram-recap' }}
  IS_THREADS_TEXT_RUN: ${{ github.event.schedule == '17 16 * * 2,4' || github.event.inputs.run == 'threads-text' }}
  IS_THREADS_RECAP_RUN: ${{ github.event.schedule == '29 16 * * 5' || github.event.inputs.run == 'threads-recap' }}
  IS_TELEGRAM_DIVERGENCE_RUN: ${{ github.event.schedule == '41 18 * * 4' || github.event.inputs.run == 'telegram-divergence' }}
  IS_TELEGRAM_POLL_RUN: ${{ github.event.schedule == '13 17 * * 3' || github.event.inputs.run == 'telegram-poll' }}
  IS_X_VIDEO_RUN: ${{ github.event.schedule == '43 18 * * 3' || github.event.inputs.run == 'x-video' }}
  IS_INSTAGRAM_REEL_RUN: ${{ github.event.schedule == '47 18 * * 1,5' || github.event.inputs.run == 'instagram-reel' }}
  IS_YOUTUBE_VIDEO_RUN: ${{ github.event.schedule == '57 18 * * 1,3,5' || github.event.inputs.run == 'youtube-video' }}
  IS_VIDEO_RUN: ${{ github.event.schedule == '43 18 * * 3' || github.event.schedule == '47 18 * * 1,5' || github.event.schedule == '57 18 * * 1,3,5' || github.event.inputs.run == 'x-video' || github.event.inputs.run == 'instagram-reel' || github.event.inputs.run == 'youtube-video' }}
  IS_INSTAGRAM_CAROUSEL_RUN: ${{ github.event.schedule == '29 18 * * 0,3' || github.event.inputs.run == 'instagram-carousel' }}
  IS_D1_SMOKE_RUN: ${{ github.event.inputs.run == 'd1-smoke' }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}

jobs:
  post-social:
    name: Execute Network Routing
    if: >-
      github.ref_name == 'main' &&
      github.event.schedule != '53 * * * *' &&
      github.event.schedule != '31 08 * * 1' &&
      github.event.inputs.run != 'metrics' &&
      github.event.inputs.run != 'metrics-report' &&
      github.event.inputs.run != 'meta-token-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: coingecko-api-counter
      cancel-in-progress: false
      # Supported by GitHub Actions since 2026-05-07; actionlint v1.7.12 predates this schema field.
      queue: max
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore CoinGecko monthly quota counter
        if: env.IS_D1_SMOKE_RUN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-coingecko-api-counter-

      - name: Cache Hugging Face Models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-kokoro-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-kokoro-

      - name: Restore social tracking state
        # D1 is authoritative for delivery. This cache only preserves local
        # creative/cooldown metadata used by the publishing scripts.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/posted
            data/posted_video
          key: ${{ runner.os }}-social-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-social-state-

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Ops Ledger Migrations
        continue-on-error: true
        run: npx tsx scripts/d1-migrate.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Record Automation Run Started
        continue-on-error: true
        run: npx tsx scripts/record-automation-run.ts --status started
        env:
          AUTOMATION_SLOT: ${{ github.event.schedule || github.event.inputs.run || github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Run Weekly R2 Staging Cleanup
        if: github.event.schedule == '17 08 * * 1'
        continue-on-error: true
        run: npx tsx scripts/cleanup-r2-staging.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Record Weekly Cloudflare Usage Snapshot
        if: github.event.schedule == '17 08 * * 1'
        continue-on-error: true
        run: npx tsx scripts/snapshot-cloudflare-usage.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_METRICS_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_METRICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # All price-sensitive routes consume one freshly computed Risk/Growth
      # snapshot. Route steps are gated on this outcome so a failed refresh
      # cannot silently publish mixed-timestamp metrics.
      - name: Refresh Market Inputs and Derived Metrics For Price-Sensitive Routes
        id: refresh-social-metrics
        if: always() && env.IS_D1_SMOKE_RUN != 'true' && env.IS_TELEGRAM_POLL_RUN != 'true'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          full_refresh_args=()
          readiness_mode=""
          if [[ "$IS_X_COMPARISON_RUN" == "true" ||
                "$IS_TELEGRAM_COMPARISON_RUN" == "true" ]]; then
            full_refresh_args=(
              --full-refresh-limit 8
              --full-refresh-max-age-days 7
              --full-refresh-min-success 4
              --full-refresh-order social-rank
              --full-refresh-rank-limit 250
            )
            readiness_mode="comparison"
          elif [[ "$IS_VIDEO_RUN" == "true" ]]; then
            full_refresh_args=(
              --full-refresh-limit 8
              --full-refresh-max-age-days 7
              --full-refresh-min-success 4
              --full-refresh-order social-rank
              --full-refresh-rank-limit 50
            )
            readiness_mode="video"
          fi

          npx tsx scripts/fetch-crypto-data.ts \
            --start 1 --end 500 --lite --bypass-cache \
            "${full_refresh_args[@]}"
          npx tsx scripts/compute-metrics.ts
          if [[ -n "$readiness_mode" ]]; then
            npx tsx scripts/validate-social-market-readiness.ts --mode "$readiness_mode"
          fi
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: D1 Smoke Test
        id: d1-smoke
        if: always() && env.IS_D1_SMOKE_RUN == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: npx tsx scripts/d1-smoke.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      # ─── 1. Telegram Market Update (1x/day) ──
      - name: Telegram Periodic Update
        id: telegram-market
        if: always() && env.IS_TELEGRAM_MARKET_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-market-updates.ts --platform telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: telegram-market-brief

      # Instagram Movers Carousel (Sun)
      - name: Instagram Daily Movers Carousel
        id: instagram-carousel
        if: always() && env.IS_INSTAGRAM_CAROUSEL_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: npx tsx scripts/post-instagram-daily-movers.ts
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # Meta Instagram
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # Cloudflare R2 (Media Staging)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Cloudflare D1 (best-effort ops ledger)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          SOCIAL_SLOT: instagram-carousel

      # X Token Comparison (Mon)
      - name: X Token Comparison
        id: x-comparison
        if: always() && env.IS_X_COMPARISON_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-token-comparison.ts --platform x
        env:
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: x-token-comparison

      # Telegram Token Comparison (Tue)
      - name: Telegram Token Comparison
        id: telegram-comparison
        if: always() && env.IS_TELEGRAM_COMPARISON_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-token-comparison.ts --platform telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: telegram-token-comparison

      # Telegram Community Poll (Wed; results are moderator-reviewed editorial input)
      - name: Telegram Community Poll
        id: telegram-poll
        if: always() && env.IS_TELEGRAM_POLL_RUN == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-daily-poll.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          SOCIAL_SLOT: telegram-community-poll

      # X Research Note (Tue/Thu/Fri; no repeated link replies)
      - name: X Periodic Update
        id: x-market
        if: always() && env.IS_X_MARKET_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-market-updates.ts --platform x
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: x-market-update
      # Telegram Top Movers Image (Sun @ 21:23 UTC)
      # Renders a Top 5 Gainers card in-memory using live CoinGecko data.
      # Image is never saved to disk - created, posted, and discarded.
      - name: Telegram Top Movers Card
        id: telegram-movers
        if: always() && env.IS_TELEGRAM_MOVERS_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-daily-movers.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: telegram-movers-card

      # Telegram Weekly Recap (Fri; image-backed market recap)
      - name: Telegram Weekly Recap
        id: telegram-recap
        if: always() && env.IS_TELEGRAM_RECAP_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-telegram-weekly-recap.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: telegram-weekly-recap

      # Telegram Radar Divergence (Thu; independent point-in-time snapshot)
      - name: Telegram Radar Divergence
        id: telegram-divergence
        if: always() && env.IS_TELEGRAM_DIVERGENCE_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-market-updates.ts --platform telegram --format radar-divergence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: telegram-radar-divergence

      # Threads Text Signal (Tue/Thu; text-native, no video recycle)
      - name: Threads Text Signal
        id: threads-text
        if: always() && env.IS_THREADS_TEXT_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-threads-daily.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: threads-text-signal

      # Threads Weekly Recap (Fri; text-native market recap)
      - name: Threads Weekly Recap
        id: threads-recap
        if: always() && env.IS_THREADS_RECAP_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/post-threads-daily.ts --format weekly-recap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          SOCIAL_SLOT: threads-weekly-recap

      # Native short-form video routes
      - name: Install FFmpeg
        id: install-ffmpeg
        if: always() && env.IS_VIDEO_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Hydrate Video B-roll Manifest
        id: hydrate-video-assets
        if: always() && env.IS_VIDEO_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: npx tsx scripts/sync-video-assets-from-r2.ts --manifest-only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: X Native Research Video
        id: x-video
        if: always() && env.IS_X_VIDEO_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success' && steps.install-ffmpeg.outcome == 'success' && steps.hydrate-video-assets.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: npx tsx scripts/post-video-daily.ts --platform x
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          SOCIAL_SLOT: x-native-video

      - name: Instagram Evidence Reel
        id: instagram-reel
        if: always() && env.IS_INSTAGRAM_REEL_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success' && steps.install-ffmpeg.outcome == 'success' && steps.hydrate-video-assets.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: npx tsx scripts/post-video-daily.ts --platform instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          SOCIAL_SLOT: instagram-reel

      - name: YouTube Video Breakout
        id: youtube-video
        if: always() && env.IS_YOUTUBE_VIDEO_RUN == 'true' && steps.refresh-social-metrics.outcome == 'success' && steps.install-ffmpeg.outcome == 'success' && steps.hydrate-video-assets.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: npx tsx scripts/post-video-daily.ts --platform youtube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # Cloudflare D1 (best-effort ops ledger)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          SOCIAL_SLOT: youtube-video

      - name: Check CoinGecko monthly quota counter
        id: coingecko-quota-counter
        if: always() && env.IS_D1_SMOKE_RUN != 'true'
        shell: bash
        run: |
          if [ -s data/cache/api-counter.json ] &&
            jq -e '(.month | type == "string") and (.count | type == "number" and . >= 0)' data/cache/api-counter.json >/dev/null; then
            echo "has_counter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_counter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save CoinGecko monthly quota counter
        if: always() && steps.coingecko-quota-counter.outputs.has_counter == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}

      # Each route is allowed to finish even when a sibling route fails. This
      # aggregation step restores the correct workflow conclusion afterward.
      - name: Aggregate publishing route outcomes
        id: aggregate-publishing-routes
        if: always()
        shell: bash
        env:
          ROUTE_OUTCOMES: |
            refresh-social-metrics=${{ steps.refresh-social-metrics.outcome }}
            d1-smoke=${{ steps.d1-smoke.outcome }}
            telegram-market=${{ steps.telegram-market.outcome }}
            instagram-carousel=${{ steps.instagram-carousel.outcome }}
            x-comparison=${{ steps.x-comparison.outcome }}
            telegram-comparison=${{ steps.telegram-comparison.outcome }}
            telegram-poll=${{ steps.telegram-poll.outcome }}
            x-market=${{ steps.x-market.outcome }}
            telegram-movers=${{ steps.telegram-movers.outcome }}
            telegram-recap=${{ steps.telegram-recap.outcome }}
            telegram-divergence=${{ steps.telegram-divergence.outcome }}
            threads-text=${{ steps.threads-text.outcome }}
            threads-recap=${{ steps.threads-recap.outcome }}
            install-ffmpeg=${{ steps.install-ffmpeg.outcome }}
            hydrate-video-assets=${{ steps.hydrate-video-assets.outcome }}
            x-video=${{ steps.x-video.outcome }}
            instagram-reel=${{ steps.instagram-reel.outcome }}
            youtube-video=${{ steps.youtube-video.outcome }}
        run: |
          failures=()
          while IFS='=' read -r route outcome; do
            if [[ "$outcome" == "failure" || "$outcome" == "cancelled" ]]; then
              failures+=("$route")
            fi
          done <<< "$ROUTE_OUTCOMES"

          if (( ${#failures[@]} > 0 )); then
            joined="$(IFS=', '; echo "${failures[*]}")"
            echo "::error title=Social publishing routes failed::${joined}"
            exit 1
          fi

          echo "All enabled social publishing routes completed successfully."

      # ─── Best-effort Creative/Cooldown Cache ────────────────
      # Delivery state is already committed to D1 by each route. Never advance
      # the cache restore prefix with empty or partial state after a failed route.
      - name: Check social tracking state
        id: social-tracking-state
        if: success() && env.IS_D1_SMOKE_RUN != 'true'
        shell: bash
        run: |
          has_files=false
          for dir in data/posted data/posted_video; do
            if [ -d "$dir" ] && [ -n "$(find "$dir" -type f -print -quit)" ]; then
              has_files=true
              break
            fi
          done
          echo "has_files=$has_files" >> "$GITHUB_OUTPUT"

      - name: Save social tracking state
        if: success() && steps.social-tracking-state.outputs.has_files == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/posted
            data/posted_video
          key: ${{ runner.os }}-social-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Update X OAuth Secret
        # GH_PAT should be a fine-grained, single-repository token whose only
        # elevated repository permission is Secrets: write.
        if: always() && env.NEW_X_REFRESH_TOKEN != ''
        run: gh secret set X_OAUTH2_REFRESH_TOKEN --body "$NEW_X_REFRESH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload social diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: social-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/posted/
            data/posted_video/
            data/cache/api-counter.json
            remotion-props.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Record Automation Run Finished
        if: always()
        continue-on-error: true
        run: npx tsx scripts/record-automation-run.ts --status "${{ job.status }}"
        env:
          AUTOMATION_SLOT: ${{ github.event.schedule || github.event.inputs.run || github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Report Ops Ledger
        if: always() && env.IS_D1_SMOKE_RUN == 'true'
        continue-on-error: true
        run: npx tsx scripts/report-ops-ledger.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Social Automation Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  refresh-meta-tokens:
    name: Maintain Meta Access Tokens
    if: github.ref_name == 'main' && (github.event.schedule == '31 08 * * 1' || github.event.inputs.run == 'meta-token-refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: meta-token-maintenance
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate, renew, and persist Meta tokens
        run: npx tsx scripts/refresh-meta-tokens.ts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID: ${{ secrets.THREADS_ACCOUNT_ID }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  collect-social-metrics:
    name: Collect Native Social Metrics
    if: github.ref_name == 'main' && (github.event.schedule == '53 * * * *' || github.event.inputs.run == 'metrics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: social-metrics-collect
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Ops Ledger Migrations
        run: npx tsx scripts/d1-migrate.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Collect 24-hour and 7-day metrics
        timeout-minutes: 10
        run: npm run social:metrics:collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_CHANNEL_USERNAME: ${{ vars.TELEGRAM_CHANNEL_USERNAME || 'Token_Radar_Official' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

  report-social-metrics:
    name: Build Weekly Social Performance Report
    if: github.ref_name == 'main' && (github.event.schedule == '31 08 * * 1' || github.event.inputs.run == 'metrics-report')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: social-metrics-report
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Ops Ledger Migrations
        run: npx tsx scripts/d1-migrate.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Build normalized performance report
        timeout-minutes: 5
        run: npm run social:metrics:report:file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}

      - name: Upload social performance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: social-performance-${{ github.run_id }}
          path: data/analytics/social-performance-latest.md
          if-no-files-found: error
          retention-days: 30

  notify-measurement-failure:
    name: Notify Measurement Failure
    needs: [collect-social-metrics, report-social-metrics]
    if: >-
      ${{ always() && (
        needs.collect-social-metrics.result == 'failure' ||
        needs.collect-social-metrics.result == 'cancelled' ||
        needs.report-social-metrics.result == 'failure' ||
        needs.report-social-metrics.result == 'cancelled'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Notify Telegram reporting chat
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          COLLECT_RESULT: ${{ needs.collect-social-metrics.result }}
          REPORT_RESULT: ${{ needs.report-social-metrics.result }}
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; measurement failure remains visible in Actions."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Social measurement failed\nCollector: $COLLECT_RESULT\nReport: $REPORT_RESULT\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
