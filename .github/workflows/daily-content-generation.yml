# Daily Launch Content Generation & Publication
# Generates new TGE previews and full guides for newly graduated launches, then
# publishes only the resulting queue entries. Non-launch refresh tiers remain
# intentionally disabled in scripts/generate-content.ts.

name: Daily Launch Content

on:
  schedule:
    - cron: "0 6 * * *" # 1x/day (06:00 UTC)
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  CONTENT_MAX_REFRESH: "8"
  CONTENT_MAX_TGE: "2"
  CONTENT_PUBLISH_MAX: "25"

jobs:
  publish:
    name: Inject Data & Publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: coingecko-api-counter
      cancel-in-progress: false
      # Supported by GitHub Actions since 2026-05-07; actionlint v1.7.12 predates this schema field.
      queue: max
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache data/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/cache
            !data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-data-content-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-coingecko-data-content-
            ${{ runner.os }}-coingecko-data-

      - name: Restore CoinGecko monthly quota counter
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-coingecko-api-counter-

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Generate Drip Content (Smart Drip)
        timeout-minutes: 90
        run: npx tsx scripts/generate-content.ts --drip --max-refresh "$CONTENT_MAX_REFRESH" --max-tge "$CONTENT_MAX_TGE" --refresh-macro --queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Quality Gate Queued Content
        timeout-minutes: 10
        run: npx tsx scripts/quality-check.ts --dir data/queue --fix --delete-failures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish from Queue (Incorporate live data)
        timeout-minutes: 25
        run: npx tsx scripts/publish-from-queue.ts --max "$CONTENT_PUBLISH_MAX"
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Identify published token changes
        id: published
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/logs
          manifest="data/logs/published-token-ids.txt"
          : > "$manifest"
          mapfile -t token_ids < <(
            git status --porcelain=v1 --untracked-files=all -- content/tokens \
              | sed -E 's/^.. //' \
              | tr '\\' '/' \
              | awk -F/ 'NF >= 3 { print $3 }' \
              | sort -u
          )
          if (( ${#token_ids[@]} > 0 )); then
            printf '%s\n' "${token_ids[@]}" > "$manifest"
          fi
          echo "count=${#token_ids[@]}" >> "$GITHUB_OUTPUT"
          echo "Published token folders changed: ${#token_ids[@]}"

      - name: Inject Semantic Internal Links
        if: steps.published.outputs.count != '0'
        timeout-minutes: 5
        run: |
          while IFS= read -r token_id; do
            [ -n "$token_id" ] && npx tsx scripts/inject-internal-links.ts --token "$token_id"
          done < data/logs/published-token-ids.txt

      - name: Repair Published Article Formatting
        if: steps.published.outputs.count != '0'
        timeout-minutes: 10
        run: |
          while IFS= read -r token_id; do
            [ -n "$token_id" ] && npx tsx scripts/repair-article-content.ts --token "$token_id"
          done < data/logs/published-token-ids.txt

      - name: Validate Published Content
        if: steps.published.outputs.count != '0'
        timeout-minutes: 10
        run: npx tsx scripts/validate-content.ts

      - name: Build Gate Before Publish
        if: steps.published.outputs.count != '0'
        timeout-minutes: 25
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.SITE_NAME || 'TokenRadar' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Audit Rendered SEO Inventory
        if: steps.published.outputs.count != '0'
        timeout-minutes: 5
        run: npm run seo:qa

      - name: Commit published articles
        id: commit
        if: steps.published.outputs.count != '0'
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cleanup_auth() {
            git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          unset auth_header
          for dir in content/tokens data/tokens data/prices; do
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          git add \
            data/search-intent.json \
            data/search-intent-history.json \
            data/_tokens_blob.json \
            data/_metrics_blob.json \
            data/_prices_blob.json \
            data/_registry.json \
            public/og/movers.png \
            public/sitemap.xml \
            public/sitemap-main.xml \
            public/sitemap-tokens.xml
          if git diff --staged --quiet; then
            echo "No new articles published from queue"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "commit_sha=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git commit -m "chore: publish articles from queue [skip ci]"
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          base_sha="$(git rev-parse HEAD^1)"
          pushed=false
          for i in 1 2 3; do
            remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "Could not read origin/main; retrying in 5s..."
              sleep 5
              continue
            fi
            if [ "$remote_sha" != "$base_sha" ]; then
              echo "::error::origin/main changed while content was being generated. Rerun this workflow to regenerate on the latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push daily content changes after 3 attempts"
            exit 1
          fi

      - name: Check CoinGecko monthly quota counter
        id: coingecko-quota-counter
        if: always()
        shell: bash
        run: |
          if [ -s data/cache/api-counter.json ] &&
            jq -e '(.month | type == "string") and (.count | type == "number" and . >= 0)' data/cache/api-counter.json >/dev/null; then
            echo "has_counter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_counter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save CoinGecko monthly quota counter
        if: always() && steps.coingecko-quota-counter.outputs.has_counter == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache/api-counter.json
          key: ${{ runner.os }}-coingecko-api-counter-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload publication diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-content-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/quarantine/
            data/queue/
            data/prices/
            data/cache/api-counter.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Daily Publication Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  deploy:
    name: Redeploy Site
    needs: publish
    if: needs.publish.outputs.has_changes == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.publish.outputs.commit_sha }}
      allow_sha_ref: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
      TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
