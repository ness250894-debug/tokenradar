# Daily Content Generation & Publication (Smart Drip)
# The sole content generation workflow. Runs daily to:
# 1. Generate new/updated articles via Smart Drip priority queue
#    (volatile tokens → incomplete hubs → oldest stale content)
# 2. Publish from queue with live market data injection
# Budget: ~20 tracked token folders + 5 TGEs = up to ~65 articles/day.
# Market-data refreshes stay separate in daily-refresh; this cap is only for AI/editorial generation.

name: Daily Content Generation

on:
  schedule:
    - cron: "0 6 * * *" # 1x/day (06:00 UTC)
  workflow_dispatch:

concurrency:
  group: git-push-main
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  CONTENT_MAX_REFRESH: "20"
  CONTENT_MAX_TGE: "5"
  CONTENT_PUBLISH_MAX: "25"

jobs:
  publish:
    name: Inject Data & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate workflow ref
        if: github.ref_name != 'main'
        run: |
          echo "::error::Daily content generation must run from main because it publishes directly to main."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache data/cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-coingecko-data-content-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-coingecko-data-content-
            ${{ runner.os }}-coingecko-data-

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Generate Drip Content (Smart Drip)
        timeout-minutes: 90
        run: npx tsx scripts/generate-content.ts --drip --max-refresh "$CONTENT_MAX_REFRESH" --max-tge "$CONTENT_MAX_TGE" --refresh-macro --queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Quality Gate Queued Content
        timeout-minutes: 10
        run: npx tsx scripts/quality-check.ts --dir data/queue --fix --delete-failures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish from Queue (Incorporate live data)
        timeout-minutes: 25
        run: npx tsx scripts/publish-from-queue.ts --max "$CONTENT_PUBLISH_MAX"
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Inject Semantic Internal Links
        timeout-minutes: 5
        run: npx tsx scripts/inject-internal-links.ts

      - name: Repair Published Article Formatting
        timeout-minutes: 10
        run: npx tsx scripts/repair-article-content.ts

      - name: Validate Published Content
        timeout-minutes: 10
        run: npx tsx scripts/validate-content.ts

      - name: Build Gate Before Publish
        timeout-minutes: 25
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tokenradar.co' }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.SITE_NAME || 'TokenRadar' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Commit published articles
        id: commit
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for dir in content/tokens data/tokens data/prices; do
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          if git diff --staged --quiet; then
            echo "No new articles published from queue"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "commit_sha=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git commit -m "chore: publish articles from queue [skip ci]"
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          base_sha="$(git rev-parse HEAD^1)"
          pushed=false
          for i in 1 2 3; do
            remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "Could not read origin/main; retrying in 5s..."
              sleep 5
              continue
            fi
            if [ "$remote_sha" != "$base_sha" ]; then
              echo "::error::origin/main changed while content was being generated. Rerun this workflow to regenerate on the latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push daily content changes after 3 attempts"
            exit 1
          fi

      - name: Upload publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daily-content-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/quarantine/
            data/queue/
            data/prices/
            data/cache/api-counter.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Daily Publication Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  deploy:
    name: Redeploy Site
    needs: publish
    if: needs.publish.outputs.has_changes == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.publish.outputs.commit_sha }}
      allow_sha_ref: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
      TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
