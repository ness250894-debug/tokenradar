# Daily Content Generation & Publication (Smart Drip)
# The sole content generation workflow. Runs daily to:
# 1. Generate new/updated articles via Smart Drip priority queue
#    (volatile tokens → incomplete hubs → oldest stale content)
# 2. Publish from queue with live market data injection
# Budget: ~10 tracked tokens + 5 TGEs = ~35 articles/day, ~25 min runtime.

name: Daily Content Generation

on:
  schedule:
    - cron: "0 6 * * *" # 1x/day (06:00 UTC)
  workflow_dispatch:

concurrency:
  group: git-push-main
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  publish:
    name: Inject Data & Publish
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache data/cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-coingecko-data-content-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-coingecko-data-content-
            ${{ runner.os }}-coingecko-data-

      - name: Install dependencies
        run: npm ci

      - name: Generate Drip Content (Smart Drip)
        run: npx tsx scripts/generate-content.ts --drip --max-refresh 10 --max-tge 5 --refresh-macro --queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Publish from Queue (Incorporate live data)
        run: npx tsx scripts/publish-from-queue.ts --max 15
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

      - name: Inject Semantic Internal Links
        run: npx tsx scripts/inject-internal-links.ts

      - name: Commit published articles
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for dir in content/tokens data/queue data/tokens; do
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          if git diff --staged --quiet; then
            echo "No new articles published from queue"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git commit -m "chore: publish articles from queue [skip ci]"
          pushed=false
          for i in 1 2 3; do
            if git pull --no-rebase --no-edit -X ours origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push daily content changes after 3 attempts"
            exit 1
          fi

      - name: Upload publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/logs/
            data/quarantine/
            data/queue/
            data/cache/api-counter.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"$TELEGRAM_REPORT_CHAT_ID\", \"text\": \"❌ *Daily Publication Failed*\\nWorkflow: ${{ github.workflow }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"parse_mode\": \"Markdown\"}"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}

  deploy:
    name: Redeploy Site
    needs: publish
    if: needs.publish.outputs.has_changes == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
