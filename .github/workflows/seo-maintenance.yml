name: Zero-AI SEO Maintenance

on:
  schedule:
    - cron: "15 4 * * 0" # Weekly, Sunday at 04:15 UTC
  workflow_dispatch:

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  audit:
    name: Search and Index Evidence Audit
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Search Console and GA4 evidence
        run: npm run analytics:baseline
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_AUTH_MODE: oauth
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      - name: Export sitemap URL index status
        run: npm run seo:index-status -- --max 1800
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_AUTH_MODE: oauth
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      - name: Generate deterministic SEO work queue
        run: npm run seo:opportunities

      # Raw GA4/GSC exports remain on the runner. The repository is public, so
      # only the derived work queue is exposed as a short-lived artifact.
      - name: Upload sanitized SEO work queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zero-ai-seo-work-queue-${{ github.run_id }}
          path: data/analytics/seo-opportunities-*.md
          if-no-files-found: error
          retention-days: 7
