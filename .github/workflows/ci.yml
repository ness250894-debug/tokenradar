name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA expected for this CI run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SITE_URL: "https://tokenradar.co"
  NEXT_PUBLIC_SITE_NAME: "TokenRadar"

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate expected commit SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_sha $EXPECTED_SHA does not match the dispatched workflow commit $GITHUB_SHA."
            exit 1
          fi
          echo "Validated dispatched commit SHA: $GITHUB_SHA"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Validate Remotion dependency alignment
        run: npx remotion versions

      - name: Bundle Remotion compositions
        run: npx remotion bundle src/video/index.tsx

      - name: Build deterministic static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Audit rendered SEO inventory
        run: npm run seo:qa
