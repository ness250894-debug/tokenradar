name: Video Asset Refresh

on:
  schedule:
    - cron: "30 04 * * 0"
  workflow_dispatch:

concurrency:
  group: video-assets-refresh
  cancel-in-progress: false

jobs:
  refresh-video-assets:
    name: Refresh Persistent B-roll Library
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Hydrate Current R2 Library
        run: npx tsx scripts/sync-video-assets-from-r2.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Fetch Provider B-roll
        run: npx tsx scripts/fetch-video-assets.ts --max 8
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Refresh Blender Loops
        run: npx tsx scripts/generate-blender-assets.ts --preset all --seconds 8 --optional

      - name: Prune B-roll Budget
        run: npx tsx scripts/prune-video-assets.ts --delete-local

      - name: Publish B-roll Library to R2
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 credentials are not configured; skipping b-roll publish."
            exit 0
          fi
          npx tsx scripts/sync-video-assets-to-r2.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Delete Unreferenced R2 B-roll
        run: npx tsx scripts/prune-video-assets.ts --r2-only --delete-r2-unreferenced
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Upload video asset diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: video-assets-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public/video-assets/broll/manifest.json
            public/video-assets/broll/*.mp4
            npm-debug.log*
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "$TELEGRAM_REPORT_BOT_TOKEN" ] || [ -z "$TELEGRAM_REPORT_CHAT_ID" ]; then
            echo "Telegram report secrets are not configured; skipping failure notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_REPORT_CHAT_ID" \
            --arg text "Video Asset Refresh Failed\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
          curl --fail --show-error --silent --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_REPORT_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
